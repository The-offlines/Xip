[package]
name = "xip"
version = "0.1.0"
description = "XiP Solana tipping protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "xip"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["associated_token", "token"] }
